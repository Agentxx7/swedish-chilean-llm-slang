[project]
name = "llm-slang-training"
version = "0.1.0"
description = "QLoRA training lab for Swedish slang and Chilean Spanish"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.6.0",
    "transformers>=4.52.4",
    "datasets",
    "accelerate",
    "peft",
    "trl",
    "bitsandbytes",
    "safetensors",
    "sentencepiece",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
