model:
  id: Qwen/Qwen3-0.6B
  max_length: 256

data:
  train_file: data/train/scanian_malmo_train.jsonl
  validation_file: data/validation/scanian_malmo_validation.jsonl

quantization:
  quant_type: nf4
  double_quant: true
  compute_dtype: bfloat16

lora:
  rank: 8
  alpha: 16
  dropout: 0.05
  target_modules: all-linear

training:
  epochs: 4
  learning_rate: 0.0001
  train_batch_size: 1
  eval_batch_size: 1
  gradient_accumulation_steps: 4
  warmup_ratio: 0.1
  seed: 42

output:
  run_directory: outputs/scanian-malmo-run
  adapter_directory: outputs/scanian-malmo-run/final-adapter
  metrics_file: outputs/scanian-malmo-run/metrics.json
